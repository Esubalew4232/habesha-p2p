<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#04121a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="ethioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="33%" stop-color="#16a34a" />
      <stop offset="34%" stop-color="#eab308" />
      <stop offset="66%" stop-color="#eab308" />
      <stop offset="67%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Ethiopian Flag Subtle Accent Bar -->
  <rect x="156" y="60" width="200" height="8" rx="4" fill="url(#ethioGrad)" opacity="0.9" />

  <!-- Shield Base (Escrow Protection) -->
  <path d="M256 96 C336 96, 384 128, 384 192 C384 316, 290 392, 256 424 C222 392, 128 316, 128 192 C128 128, 176 96, 256 96 Z"
        fill="url(#shieldGrad)"
        filter="url(#glow)"
        opacity="0.95" />

  <!-- Inner Shield Core -->
  <path d="M256 120 C316 120, 356 146, 356 200 C356 296, 282 360, 256 388 C230 360, 156 296, 156 200 C156 146, 196 120, 256 120 Z"
        fill="#041820"
        opacity="0.9" />

  <!-- Authoritative Lock Icon in Gold -->
  <!-- Lock Shackle -->
  <path d="M224 220 V196 C224 178, 238 164, 256 164 C274 164, 288 178, 288 196 V220"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="18"
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="206" y="218" width="100" height="78" rx="16" fill="url(#goldGrad)" />
  <circle cx="256" cy="252" r="8" fill="#1e293b" />
  <polygon points="253,252 259,252 261,274 251,274" fill="#1e293b" />

  <!-- P2P USDT Monogram Indicator -->
  <text x="256" y="345" text-anchor="middle" fill="#5eead4" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="3">HABESHA</text>
  <text x="256" y="368" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="6">P2P ESCROW</text>
</svg>
